name: Release (Container)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-container:
    runs-on: ubuntu-latest

    env:
      CONTAINER: docker

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Build release
      id: build-release
      run: make release-container

    # Autorun on the Switch installs a release by asset name alone and unpacks
    # it with its own tar reader, so a payload it would refuse must fail here.
    # tools/check-release.py repeats those rules, including the 1.14.1 ceiling
    # its options table stops at.
    - name: Check the payload Autorun unpacks
      id: check-payload
      run: |
        python3 tools/check-release.py --self-test
        for archive in releases/*.tar.gz; do
          python3 tools/check-release.py "$archive"
        done

    - name: List artifacts
      id: list-artifacts
      run: du -h releases/*

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dxvk-sarek-${{ github.ref_name }}
        path: releases/*
        if-no-files-found: error

    - name: Publish release
      id: publish-release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: releases/*
